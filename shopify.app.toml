# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "b3ef8e3d2090793c6a6c1dd517644358"
name = "Inkly ERP Sync"
handle = "inkly-erp-sync"
application_url = "https://example.com"
embedded = true

[access_scopes]
# read_orders: the orders/create webhook. *_merchant_managed_fulfillment_orders: create the fulfillment with the ERP's tracking number.
scopes = "read_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Only the fields the ERP needs: no customer name, email, phone or address leaves Shopify.
  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders/create"
  include_fields = ["id", "admin_graphql_api_id", "name", "created_at", "currency", "total_price", "line_items"]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true
